# The core module has no dependencies to update by design, so it is not listed:
# an update to it would be a bug. The nested modules and the actions in CI are
# what actually move.
version: 2
updates:
  # The modules that move freely.
  - package-ecosystem: gomod
    directories:
      - /backend/stilus
      - /backend/window
      - /arrow/v18
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  # The deprecated gg modules (docs/adr/0094). gg v0.52.5 — the version both
  # pin — makes the render-pass calls wgpu v0.33 turned into struct arguments,
  # so anything that drags wgpu to v0.33 or later fails to build gg itself;
  # gogpu v0.53.2 and gpucontext v0.30 do exactly that. Holding the ceiling
  # here keeps Dependabot from reopening a bump that cannot compile. The window
  # used to share it and does not: it draws through stilus and is on wgpu v0.34.
  - package-ecosystem: gomod
    directories:
      - /backend/gg
      - /backend/gg/gpu
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: github.com/gogpu/wgpu
        versions: [">=0.33.0"]
      - dependency-name: github.com/gogpu/gogpu
        versions: [">=0.53.2"]
      - dependency-name: github.com/gogpu/gpucontext
        versions: [">=0.30.0"]
      - dependency-name: github.com/gogpu/gputypes
        versions: [">=0.7.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
