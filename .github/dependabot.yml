# The core module has no dependencies to update by design, so it is not listed:
# an update to it would be a bug. The nested modules and the actions in CI are
# what actually move.
#
# backend/gg and backend/gg/gpu are not listed either. They are deprecated and
# removed in v0.20.0 (docs/adr/0094); until then they build unchanged, and a
# bump to a module on its way out is churn — every gg or wgpu bump there was
# also one that could not compile, since gg v0.52.5 makes the render-pass calls
# wgpu v0.33 turned into struct arguments.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /backend/stilus
      - /backend/window
      - /arrow/v18
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    # A nested module's require on figure's own modules is a floor, not a pin:
    # it moves only when the module needs an API the version it names does not
    # have, and the release check is what says so (CONTRIBUTING, "When a
    # require line does have to move"). A bump to the latest tag on every
    # release is noise that says nothing about what the module needs.
    ignore:
      - dependency-name: github.com/timzifer/figure
      - dependency-name: github.com/timzifer/figure/*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
